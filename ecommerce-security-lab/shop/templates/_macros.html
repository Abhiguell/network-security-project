{% macro product_card(p, back='') -%}
<div class="product-card">
  <a href="{{ url_for('store.product', pid=p.id) }}"><div class="thumb" style="background: linear-gradient(135deg, {{ p.color }}22, {{ p.color }}55)">{{ p.emoji }}</div></a>
  <div class="body">
    <span class="cat-tag">{{ p.category }}</span>
    <a class="name" href="{{ url_for('store.product', pid=p.id) }}">{{ p.name }}</a>
    <span class="price">{{ p.price|rupiah }}</span>
    {% if p.stock == 0 %}<span class="stock out">Out of stock</span>{% elif p.stock < 20 %}<span class="stock low">Only {{ p.stock }} left</span>{% else %}<span class="stock">In stock</span>{% endif %}
    <form method="post" action="{{ url_for('store.cart_add') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="product_id" value="{{ p.id }}">
      <input type="hidden" name="back" value="{{ back }}">
      <button class="btn btn-sm w-100" type="submit" {{ 'disabled' if p.stock == 0 }}>+ Add to cart</button>
    </form>
  </div>
</div>
{%- endmacro %}

{% macro status_badge(s) -%}<span class="badge b-{{ s }}">{{ s }}</span>{%- endmacro %}
