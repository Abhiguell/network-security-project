{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Create your account</h1>
  <p class="sim-note">Please use <b>made-up details</b>: this is a test store for a security project.</p>
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ form.username }}" maxlength="20" required>
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" value="{{ form.full_name }}" maxlength="60" required>
    <div class="row">
      <div><label for="email">Email</label><input type="email" id="email" name="email" value="{{ form.email }}" maxlength="100" required></div>
      <div><label for="phone">Phone</label><input type="text" id="phone" name="phone" value="{{ form.phone }}" maxlength="20" required></div>
    </div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" maxlength="128" required>
    <p class="hint">At least 8 characters with uppercase, lowercase, number and symbol.</p>
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" maxlength="128" required>
    <button class="btn btn-lg w-100 mt" type="submit">Create account</button>
  </form>
  <p class="small center mt">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
