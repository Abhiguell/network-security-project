{% extends "base.html" %}
{% block title %}{{ code }} {{ title }}{% endblock %}
{% block content %}
<div class="card center" style="max-width:560px;margin:30px auto">
  <p style="font-size:4rem;font-weight:800;color:var(--brand);margin:0">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('store.home') }}">Back to the store</a>
</div>
{% endblock %}
